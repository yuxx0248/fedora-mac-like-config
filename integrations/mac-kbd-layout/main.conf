# managed by fedora-mac-like-config
# Copilot key (2nd key right of Space on the Zenbook A16) -> Handy's
# transcribe shortcut. The Copilot key emits a leftshift+leftalt chord
# at the evdev level (the Win half of its raw Shift+Win signal is already
# remapped to leftalt by /etc/udev/hwdb.d/90-mac-style-kbd.hwdb).
# keyd holds Ctrl+Alt+Space for as long as the key is held, which matches
# Handy's hold_or_toggle push-to-talk behaviour.
[ids]
0b05:4b42

[main]
leftshift+leftalt = C-A-space

# Preserve the input-method switch on phys Ctrl+Space: this explicit chord
# wins over the macctrl layer, so it still emits Super+Space for ibus.
leftmeta+space = M-space

# Physical left Ctrl arrives here as leftmeta (hwdb remap). Dual role,
# mac-style Command key:
#   tap               -> meta (Overview, unchanged)
#   held with any key -> macctrl layer
# macctrl is a custom layer (NOT the implicit control layer) so that
# physAlt -> native leftctrl keeps plain Ctrl+C, which GNOME Terminal's
# copy accelerator (<Control>c, mac Cmd+C role, by design) consumes as
# "copy". Inside macctrl, c is rewritten to Ctrl+Shift+C: the copy
# accelerator does not match it, VTE encodes it as 0x03 (same interrupt
# byte as Ctrl+C) -> held-physCtrl+C = real SIGINT. Every other chord is
# re-bound to its plain Ctrl form so GUI/terminal Ctrl behaviour is
# preserved. Any key missing here falls through as Super+key (tell
# maintenance to add it).
leftmeta = overload(macctrl, layer(meta))

[macctrl]
# Input-method switch: held-physCtrl+Space must still emit Super+Space
# (the [main] leftmeta+space chord is shadowed while the layer is active).
space = M-space
c = C-S-c
a = C-a
b = C-b
d = C-d
e = C-e
f = C-f
g = C-g
h = C-h
i = C-i
j = C-j
k = C-k
l = C-l
m = C-m
n = C-n
o = C-o
p = C-p
q = C-q
r = C-r
